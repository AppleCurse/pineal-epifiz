[package]
name = "pineal_heretic_core"
version = "5.0.0"
edition = "2021"
authors = ["Pineal-Heretic Team"]
description = "Core Rust engine for Pineal-Heretic v5.0 - Memory-safe, type-secure agent orchestration"

[lib]
name = "pineal_heretic_core"
path = "src/lib.rs"

[dependencies]
# Cryptography & Security
age = "0.10"
argon2 = "0.5"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = { version = "1.7", features = ["derive"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1.77"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Network
# [W4.1] rustls: native-tls (openssl-sys) CI/runner'da libssl-dev ister;
# rustls-tls saf Rust -> sistem bağımlılığı yok. HTTPS davranışı aynı.
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Logging
tracing = "0.1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID for task isolation
uuid = { version = "1.0", features = ["v4", "serde"] }
ndarray = "0.17.2"
# [048] fix: adli telemetri hash'i SHA-256 (MD5 değil)
sha2 = "0.10"

# Tauri — [W4.1] optional: rust_core, masaüstü kabuğu OLMADAN da (CI'da webkit
# sistem bağımlılıkları olmadan) derlenip test edilebilsin. src-tauri bu
# feature'ı açar.
tauri = { version = "2", optional = true }
redis = { version = "0.27", optional = true, features = ["tokio-comp"] }
futures-util = { version = "0.3", optional = true }

[features]
default = []
tauri = ["dep:tauri"]
redis = ["dep:redis", "dep:futures-util"]

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = "0.3"
tempfile = "3.0"
