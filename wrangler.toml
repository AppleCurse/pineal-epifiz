# Cloudflare dağıtım yapılandırması — PINEAL frontend + /api,/ws proxy.
#
# [RÖNTGEN 2026-09-23] Bu dosya WORKERS-tipi (static assets) yapılandırmadır,
# çünkü depoya bağlı Cloudflare projeleri Workers SERVİSİ:
#   check details_url -> dash.cloudflare.com/<acct>/workers/services/view/pineal-clean/...
#   check details_url -> dash.cloudflare.com/<acct>/workers/services/view/pineal-gland/...
# Eskiden burada yalnız `pages_build_output_dir` vardı ve `main`/`[assets]`
# YOKTU; ölçülen sonuç:
#   $ npx wrangler deploy --dry-run
#   ✘ [ERROR] There is no JavaScript/TypeScript to deploy ... add `main = ...`
#             veya `[assets] directory = ...`
# yani Workers Builds daha frontend derlenmeden YAPILANDIRMA adımında ölüyordu.
#
# İKİ TİP BİR ARADA OLMUYOR (ölçüldü): `pages_build_output_dir` üst düzeyde
# dururken wrangler yapılandırmayı Pages sayıyor ve
#   ✘ [ERROR] The name 'ASSETS' is reserved in Pages projects.
# hatası veriyor. Bu yüzden Pages yolu AYRI dosyaya taşındı: `wrangler.pages.toml`
# (kullanımı: npx wrangler pages deploy -c wrangler.pages.toml frontend/dist).
#
# Statik çıktı : frontend/dist  (kök `npm run build` üretir)
# Worker girişi: worker.ts — /api/* ve /ws/* davranışı functions/ altındaki
#                Pages handler'larından IMPORT edilir (kopya yok, tek sözleşme).
#
# BACKEND_ORIGIN: FastAPI backendinin kökeni. SECRET olarak ayarlanır
# (vars'a yazılmaz): npx wrangler secret put BACKEND_ORIGIN
# Ayarlı değilse proxy uçları uydurma davranış GÖSTERMEZ — 502 + açık hata kodu.

name = "pineal-frontend"
compatibility_date = "2026-09-01"
main = "worker.ts"

[assets]
directory = "frontend/dist"
binding = "ASSETS"

[build]
command = "npm run build"
