name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # [2026-10-05] Takım 1113 -> 1690 teste büyüdü; 10 dakika CI'da yetmiyor
    # (koşu testler sürerken kesiliyordu). Yerel tam koşu ~100s.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (requirements.lock = production image tree)
        # [2026-09-18 B7] Dockerfile requirements.lock kurar; CI eskiden
        # requirements.txt'i taze çözüyordu -> prod ile test edilen ağaç
        # farklıydı (ölçülen: 20 paket sürüm farkı, 2 test skip/geçer farkı).
        run: |
          pip install -r requirements.lock ruff pytest pytest-asyncio pytest-cov pytest-timeout
      - name: Lint with ruff
        run: ruff check .
      - name: Run backend tests with coverage gate
        # [2026-10-05] `--timeout`: CI'da tek bir ağ bekleyen test tüm işi
        # kilitleyip 20 dakikada iptal ettiriyordu (yerel tam koşu ~100s).
        # Süre aşımı olan test artık TAKILMAZ, FAIL yazar.
        run: PYTHONPATH=$GITHUB_WORKSPACE pytest -q -p no:cacheprovider --timeout=300 --durations=25 --cov=agent_core --cov=backend --cov-report=term-missing:skip-covered --cov-fail-under=80
      - name: Audit regression guard (E0 — 24 denetim bulgusu makine bekçisinde)
        # [FAZ E · E0] docs/reports/JULES_DENETIM_2026-10-06.md 24 bulgu üretti ve
        # her birine insan gözü için bir `DOĞRULA` komutu yazdı; hiçbiri makine
        # tarafından koşulmuyordu. Bu adım o raporu ÇALIŞAN bekçiye çevirir:
        # her bulgu statik / test-kapılı / doğrulanamaz olarak sınıflanır,
        # `reports/audit_regression.json` üretilir ve KNOWN_OPEN dışında AÇILAN
        # bir bulgu olursa exit 1 (regresyon). Liste bayatlarsa da exit 1 —
        # yani onarılan bulgu kayda geçmek ZORUNDA (halı altına süpürme yok).
        #
        # [SESSİZ-ÇÖKME-YOK] Actions logları Azure blob'da tutulur ve her ortamdan
        # okunamaz (bu adımın ilk denemesinde tam olarak bu oldu: "exit code 1"
        # dışında hiçbir şey görünmüyordu). Bu yüzden başarısızlık AYRINTISI
        # ayrıca workflow ANNOTATION'ı olarak yüzeye çıkarılır — annotation'lar
        # api.github.com'dan okunabilir.
        run: |
          set +e
          python scripts/audit_regression.py | tee /tmp/audit-guard.log
          guard_rc=${PIPESTATUS[0]}
          git diff -- reports/audit_regression.json > /tmp/audit-report.diff
          if [ -s /tmp/audit-report.diff ]; then
            blob=$(head -60 /tmp/audit-report.diff | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=audit-report-stale::Commit'lenen reports/audit_regression.json bayat — bekçi yeniden koşunca farklı ölçüm üretti. Diff:%0A${blob}"
            guard_rc=1
          fi
          if [ "$guard_rc" -ne 0 ]; then
            tail -40 /tmp/audit-guard.log
          fi
          exit $guard_rc
      - name: Verify routing shadows committed fresh
        run: |
          python scripts/generate_routing_shadows.py
          git diff --exit-code
      - name: Verify skills package committed fresh
        # [FAZ D · D1] Skills paketi defterden üretilir; elle düzenlenmiş ya da
        # defterde olmayan bir yetenek dosyası sessizce geçemez (exit 3 = bayat).
        run: python scripts/export_skills.py --check
      - name: Verify provider catalog contract (OpenRouter + Nous)
        run: |
          OUT="$(python scripts/verify_openrouter_catalog.py)"; RC=$?
          echo "$OUT"
          if printf '%s' "$OUT" | grep -q "SKIP: live OpenRouter check"; then
            echo "::warning title=catalog-live::Live OpenRouter cross-check SKIPPED — OPENROUTER_API_KEY secret tanımlı değil; yerel katalog kontratı koştu (model var/yok doğrulaması canlı katalog olmadan yapılamaz)."
          fi
          exit $RC
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check Svelte types
        run: npm run check
      - name: Build frontend
        run: npm run build
      - name: Verify real Svelte build
        run: |
          grep -q "PINEAL-HERETIC" dist/assets/*.js
          grep -Fq "$(cat ../VERSION)" dist/assets/*.js

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies (requirements.lock)
        run: pip install -r requirements.lock
      - name: Build frontend (so smoke tests the real dist)
        run: cd frontend && npm ci && npm run build
      - name: uvicorn smoke
        # [AUDIT P2-10 sonrası] Ortam açıkça geliştirme ilan edilmelidir.
        # Auth artık fail-closed: PINEAL_ENV boş bırakılırsa ortam ÜRETİM
        # sayılır ve PINEAL_TOKEN zorunlu olur -> lifespan
        # SecurityConfigurationError(PRODUCTION_AUTH_REQUIRED) ile yeniden
        # raise eder, uvicorn hiç dinlemeye geçmez ve aşağıdaki dört curl de
        # başarısız olur. Ölçülen: PR #61 smoke PASS, bu değişiklikten sonra
        # PR #64 smoke FAIL. Güvenlik düzeltmesi doğru; eksik olan smoke'un
        # kendi bağlamını beyan etmesiydi.
        env:
          PINEAL_ENV: development
        run: |
          uvicorn backend.api:app --port 8000 &
          for i in $(seq 1 30); do curl -sf "http://127.0.0.1:8000/api/telemetry?client_id=ci" && break || sleep 1; done
          curl -sf "http://127.0.0.1:8000/" | grep -q 'id="app"'
          curl -s -o /dev/null -w "%{http_code}" -X POST "http://127.0.0.1:8000/api/aspasia/chat" -H 'Content-Type: application/json' -d '{"client_id":"ci","user_message":"hi"}' | grep -q 200
          curl -sf "http://127.0.0.1:8000/health" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d['status'] in ('ready','degraded') else 1)"
      - name: MCP stdio handshake smoke
        # [FAZ D · D1] Sunucu gerçekten konuşuyor mu: stateless tools/list +
        # kasa kapalıyken dürüst ret. stdout'a tek bir günlük satırı sızarsa
        # bu adım JSON çözümünde patlar (kanal yalnız protokol taşır).
        # NOT: bu adımda çok satırlı Python KULLANMA — `run: |` bloğunun
        # girintisini bozup workflow'u geçersiz kılıyor (2026-10-07 dersi).
        env:
          PINEAL_ENV: development
        run: |
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28"}}}'
            printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"extractor_text_language","arguments":{"subject":"Merhaba dünya, bugün hava güzel."},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28"}}}'
          } | python -m agent_core.mcp > /tmp/mcp_smoke.ndjson

          python3 -c "import json; lines=[json.loads(l) for l in open('/tmp/mcp_smoke.ndjson') if l.strip()]; listing=lines[0]['result']; assert len(listing['tools']) >= 15, listing; assert listing['resultType'] == 'complete', listing; call=lines[1]['result']; assert call['isError'] is True, call; assert call['structuredContent']['denied_by'] == 'vault', call; print('MCP smoke OK:', len(listing['tools']), 'arac - kasa kapaliyken durust ret')"

  rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust_core
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_core
      # [SESSİZ-ÇÖKME-YOK] Actions logları Azure blob storage'da tutulur ve her
      # ortamdan okunamaz; "Process completed with exit code 101" dışında hiçbir
      # şey görünmediğinde hata fiilen HALI ALTINA süpürülmüş olur. Bu yüzden
      # derleyici/test hataları ayrıca workflow ANNOTATION'ı olarak yüzeye
      # çıkarılır — annotation'lar api.github.com üzerinden okunabilir.
      - name: Cargo check (core, no tauri feature)
        run: |
          set +e
          cargo check --all-targets --message-format=short 2>&1 | tee /tmp/cargo-check.log
          code=${PIPESTATUS[0]}
          # TEK annotation'da ham log kuyruğu: Actions annotation sayısı adım
          # başına sınırlı, ama annotation METNİ api.github.com'dan okunabilir.
          blob=$(grep -nE 'error|warning: unused|-->|panicked' /tmp/cargo-check.log \
                   | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=cargo-check-failed::${blob}"
          exit $code
      - name: Cargo test
        run: |
          set +e
          cargo test --locked 2>&1 | tee /tmp/cargo-test.log
          code=${PIPESTATUS[0]}
          blob=$(grep -nE 'panicked at|^error|assertion|failures:|FAILED' /tmp/cargo-test.log \
                   | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=cargo-test-failed::${blob}"
          exit $code

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'
      - name: Verify Gradle toolchain
        run: gradle --version
      - name: Android lint
        run: gradle lintDebug
      - name: Android unit tests
        run: gradle testDebugUnitTest
      - name: Android assemble
        run: gradle assembleDebug
