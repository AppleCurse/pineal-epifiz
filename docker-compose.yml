services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - pineal_redis:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  pineal:
    build:
      context: .
      args:
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - PINEAL_PORT=8000
      - PINEAL_ENV=${PINEAL_ENV:-production}
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    volumes:
      - pineal_memory:/app/memory
      - pineal_cache:/app/cache
      - pineal_vault:/app/vault-data
    deploy:
      replicas: 1
    restart: unless-stopped

  # ─── Ajan CANLILIK İŞARETÇİLERİ (liveness beacon) — 12 yuva ─────────────

  # [AUDIT 2026-10-07 · Madde 3] BU SERVİSLER ANALİZ YÜRÜTMEZ.

  #

  # Eski adları `agent-*` idi ve "12 bağımsız ajan servisi" diye

  # belgelenmişti; bu, her konteynerin kendi başına analiz çalıştırdığı

  # izlenimini veriyordu. GERÇEK: analizleri `PinealExecutor` SÜREÇ İÇİNDE

  # (in-process) yürütür; bu konteynerler yalnızca "yuva boşta ve canlı"

  # sinyalini KENDİ kanallarına (`pineal:agent:beacon`) yayınlar.

  #

  # Eski kod ayrıca her 30 saniyede bir koşulsuz `Ready` basıyordu; yani

  # hiçbir ajan çalışmadan operasyonel durum UYDURUYORDU. Artık ajan durum

  # kanalına (`pineal:agent:status`) YAZILMAZ, dolayısıyla yürütücünün

  # yazdığı gerçek Active/Ready/Done/Error geçişleri de EZİLMEZ.

  # Ayrıntı: agent_core/workers/agent_worker.py (modül docstring'i).

  #

  # Aynı imaj, farklı AGENT_ID env ile çalışır.

  # Her biri Redis Pub/Sub üzerinden durum yayınlar: Ready/Active/Wait
  # Backend /api/agents/status üzerinden de POST edebilirler
  # Aynı imaj, farklı AGENT_ID env ile çalışır

  beacon-mirror-truth:
    build: { context: . }
    depends_on: [redis]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - AGENT_ID=mirror_truth
      - AGENT_NAME=Mirror Truth
    command: python -m agent_core.workers.agent_worker --agent-id mirror_truth
    restart: unless-stopped
    volumes:
      - pineal_memory:/app/memory
      - pineal_cache:/app/cache

